[package]
name = "ghidrust-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ghidrust CLI and MCP/agent tool surface"

[[bin]]
name = "ghidrust"
path = "src/main.rs"

[dependencies]
ghidrust-core = { workspace = true, features = ["gpu"] }
ghidrust-decomp = { workspace = true, features = ["gpu"] }
ghidrust-il2cpp = { workspace = true }
ghidrust-unity-inventory = { workspace = true }
ghidrust-types = { workspace = true }
ghidrust-net-schema = { workspace = true }
ghidrust-net-correlate = { workspace = true }
ghidrust-net-attr = { workspace = true }
ghidrust-net-capture = { workspace = true }
ghidrust-net-detect = { workspace = true }
ghidrust-net-parse = { workspace = true }
ghidrust-net-rules = { workspace = true }
ghidrust-net-flow = { workspace = true }
ghidrust-agent = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
ghidrust-net-capture = { workspace = true }
ghidrust-net-flow = { workspace = true }
ghidrust-net-schema = { workspace = true }
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

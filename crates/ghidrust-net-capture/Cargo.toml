[package]
name = "ghidrust-net-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native frame acquisition, capture-file IO, and session helper"

[[bin]]
name = "ghidrust-netcap"
path = "src/bin/netcap.rs"
required-features = []

[dependencies]
ghidrust-net-schema = { workspace = true }
ghidrust-net-attr = { workspace = true }
ghidrust-net-flow = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
